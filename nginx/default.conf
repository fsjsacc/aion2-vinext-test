# AION2-KINA nginx — 复刻 db11 nginx
#
# db11 nginx 关键配置（GUIDE/archive/AION2-KINA-DB11-DEPLOY-20260803.md §二）：
#   location / → 反代 127.0.0.1:3000
#   proxy_read_timeout 120s
#   deny /cdn-cgi/ /__debug /@fs/（屏蔽 miniflare dev 路径）

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # db11 nginx: proxy_read_timeout 120s
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # db11 nginx: 屏蔽 miniflare Local Explorer 与 dev 内部路径
    location ~ ^/(cdn-cgi|__debug|@fs|@vite|@id) {
        deny all;
        return 404;
    }
}
