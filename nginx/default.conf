# AION2-KINA nginx — 复刻 db11 nginx
#
# db11 nginx 关键配置（GUIDE/archive/AION2-KINA-DB11-DEPLOY-20260803.md §二）：
#   location / → 反代 127.0.0.1:3000
#   proxy_read_timeout 120s
#   deny /cdn-cgi/ /__debug
#
# ⚠️ 重要差异（2026-09-18 修正）：
# db11 的 nginx 额外 deny 了 @fs / @vite / @id，因为 db11 上这三个前缀
# 对浏览器不可见（vinext 在 127.0.0.1 上跑，且实际走的是构建产物）。
#
# 但本验证站/迁移站是「vinext dev 直接对外服务」，浏览器的 ESM 入口就是：
#   /@id/__x00__virtual:vite-rsc/entry-browser   ← React 客户端入口（modulepreload）
#   /@vite/client                                ← Vite HMR 客户端
#   /@fs/...                                     ← 源码文件直读
# 一旦这三个前缀被 nginx 拦掉，页面 HTML 能返回 200，但所有客户端 JS 全部
# 加载失败 → 地图不渲染、标记点无响应、按钮失效（即「运行有问题」）。
#
# 因此这里只保留 cdn-cgi（miniflare Local Explorer）和 __debug 的拦截。
# @fs / @vite / @id 必须放行。

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # db11 nginx: proxy_read_timeout 120s
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 屏蔽 miniflare Local Explorer 与调试端点。
    # 注意：不要在这里加 @fs / @vite / @id —— 它们是 Vite dev server 的
    # 正常公开路径，屏蔽会导致前端彻底不工作（详见文件头说明）。
    location ~ ^/(cdn-cgi|__debug) {
        deny all;
        return 404;
    }
}
