# AION2-KINA 临时隔离验证部署
#
# 目的：在 Dokploy 上验证「vinext dev」运行时能否完整复刻 db11
# 隔离：独立 compose name / 独立域名 / 独立 volume，完全不碰线上 kina compose
#
# 架构：CF 橙云 → Traefik (443) → nginx:80 → app:3000
#
# 运行时：vinext dev --port 3000 --hostname 0.0.0.0
#         （复刻 db11 app.service，仅 hostname 从 127.0.0.1 改为 0.0.0.0）

services:
  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    depends_on:
      - app
    labels:
      - "traefik.enable=true"

      # ── 生产域名 ────────────────────────────────────────────────────
      # www.aion2kina.com / aion2kina.com → CF 橙云 A → 2.25.206.13（proxied）
      - "traefik.http.routers.aion2-kina-prod.rule=Host(`www.aion2kina.com`) || Host(`aion2kina.com`)"
      - "traefik.http.routers.aion2-kina-prod.entrypoints=websecure"
      - "traefik.http.routers.aion2-kina-prod.tls=true"

      - "traefik.http.services.aion2-kina-prod.loadbalancer.server.port=80"

  app:
    build:
      context: ./app
    restart: unless-stopped
    env_file: .env
    volumes:
      # miniflare state（D1 / R2 / cache）持久化 —— 路径为项目根 .wrangler（vinext dev 约定）
      - vinext-test-state:/app/.wrangler/state/v3
      - vinext-test-data:/app/data
    # 复刻 db11 MemoryHigh=2500M / MemoryMax=3000M
    mem_limit: 3g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/en/').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  vinext-test-state:
    driver: local
  vinext-test-data:
    driver: local
