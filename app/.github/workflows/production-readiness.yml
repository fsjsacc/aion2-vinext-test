name: Production readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      content_release_as_of:
        description: Optional editorial release date (YYYY-MM-DD, Asia/Hong_Kong)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run production:check
      - run: npm test
      - run: npm run lint

  database-release-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Hong_Kong
      PGDATABASE: atlas_ci
      PGHOST: 127.0.0.1
      PGPASSWORD: atlas_ci
      PGPORT: 5432
      PGSSLMODE: disable
      PGUSER: postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_PASSWORD: atlas_ci
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Resolve editorial release date
        shell: bash
        env:
          REQUESTED_CONTENT_RELEASE_AS_OF: ${{ inputs.content_release_as_of || '' }}
        run: |
          content_release_as_of="${REQUESTED_CONTENT_RELEASE_AS_OF:-$(date +%F)}"
          if [[ ! "$content_release_as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
             [[ "$(date -d "$content_release_as_of" +%F 2>/dev/null || true)" != "$content_release_as_of" ]]; then
            echo 'content_release_as_of must be a real YYYY-MM-DD date' >&2
            exit 1
          fi
          echo "CONTENT_RELEASE_AS_OF=$content_release_as_of" >> "$GITHUB_ENV"
      - name: Create Supabase-compatible database roles
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL
      - name: Apply Atlas migrations
        run: |
          psql --set ON_ERROR_STOP=1 --single-transaction --file supabase/migrations/202607140001_atlas_map_catalog.sql
          psql --set ON_ERROR_STOP=1 --single-transaction --file supabase/migrations/202607140002_atlas_release_activation.sql
          psql --set ON_ERROR_STOP=1 --single-transaction --file supabase/migrations/202607140003_atlas_release_privileges.sql
          # 004 owns an explicit BEGIN/COMMIT so bare psql is atomic; do not nest -1.
          psql --set ON_ERROR_STOP=1 --file supabase/migrations/202607140004_atlas_content_publication.sql
          psql --set ON_ERROR_STOP=1 --file supabase/migrations/202607180001_expose_content_properties.sql
      - name: Verify release-role least privilege
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            content_table text;
          begin
            if has_table_privilege('service_role', 'atlas.channels', 'UPDATE')
              or has_table_privilege('service_role', 'atlas.releases', 'UPDATE')
              or has_table_privilege('service_role', 'atlas.release_events', 'DELETE') then
              raise exception 'service_role can bypass the guarded release state machine';
            end if;
            if not has_function_privilege(
              'service_role',
              'atlas.publish_release(text,text,integer,integer,integer,integer,integer)',
              'EXECUTE'
            ) or not has_function_privilege(
              'service_role',
              'atlas.activate_release(text,text,text,text)',
              'EXECUTE'
            ) then
              raise exception 'service_role cannot execute the guarded release functions';
            end if;
            if has_function_privilege(
              'anon',
              'atlas.publish_release(text,text,integer,integer,integer,integer,integer)',
              'EXECUTE'
            ) or has_function_privilege(
              'anon',
              'atlas.activate_release(text,text,text,text)',
              'EXECUTE'
            ) then
              raise exception 'anon can execute a privileged release function';
            end if;

            foreach content_table in array array[
              'content_releases',
              'content_entries',
              'content_translations',
              'content_sources',
              'content_media',
              'content_relations',
              'content_channels',
              'content_release_events'
            ] loop
              if not has_table_privilege(
                'service_role',
                format('atlas.%I', content_table),
                'SELECT'
              ) or (
                content_table = any (array[
                  'content_releases',
                  'content_entries',
                  'content_translations',
                  'content_sources',
                  'content_media',
                  'content_relations'
                ])
                and not has_table_privilege(
                  'service_role',
                  format('atlas.%I', content_table),
                  'INSERT'
                )
              ) or (
                content_table = any (array['content_channels', 'content_release_events'])
                and has_table_privilege(
                  'service_role',
                  format('atlas.%I', content_table),
                  'INSERT'
                )
              ) or has_table_privilege(
                'service_role',
                format('atlas.%I', content_table),
                'UPDATE'
              ) or has_table_privilege(
                'service_role',
                format('atlas.%I', content_table),
                'DELETE'
              ) or has_table_privilege(
                'service_role',
                format('atlas.%I', content_table),
                'TRUNCATE'
              ) or has_table_privilege(
                'service_role',
                format('atlas.%I', content_table),
                'TRIGGER'
              ) or has_table_privilege(
                'service_role',
                format('atlas.%I', content_table),
                'REFERENCES'
              ) or has_table_privilege(
                'service_role',
                format('atlas.%I', content_table),
                'MAINTAIN'
              ) then
                raise exception 'service_role content privilege matrix is invalid for atlas.%', content_table;
              end if;
            end loop;
            if has_sequence_privilege(
              'service_role',
              'atlas.content_release_events_id_seq',
              'USAGE'
            ) or has_sequence_privilege(
              'service_role',
              'atlas.content_release_events_id_seq',
              'UPDATE'
            ) or not has_sequence_privilege(
              'service_role',
              'atlas.content_release_events_id_seq',
              'SELECT'
            ) or has_sequence_privilege(
              'anon',
              'atlas.content_release_events_id_seq',
              'SELECT'
            ) or has_sequence_privilege(
              'anon',
              'atlas.content_release_events_id_seq',
              'USAGE'
            ) or has_sequence_privilege(
              'anon',
              'atlas.content_release_events_id_seq',
              'UPDATE'
            ) or has_sequence_privilege(
              'authenticated',
              'atlas.content_release_events_id_seq',
              'SELECT'
            ) or has_sequence_privilege(
              'authenticated',
              'atlas.content_release_events_id_seq',
              'USAGE'
            ) or has_sequence_privilege(
              'authenticated',
              'atlas.content_release_events_id_seq',
              'UPDATE'
            ) then
              raise exception 'content audit sequence privileges are broader or narrower than intended';
            end if;
            if not has_function_privilege(
              'service_role',
              'atlas.publish_content_release(text,text,integer,integer,integer,integer,integer)',
              'EXECUTE'
            ) or not has_function_privilege(
              'service_role',
              'atlas.activate_content_release(text,text,text,text)',
              'EXECUTE'
            ) then
              raise exception 'service_role cannot execute the guarded content functions';
            end if;
            if has_function_privilege(
              'anon',
              'atlas.publish_content_release(text,text,integer,integer,integer,integer,integer)',
              'EXECUTE'
            ) or has_function_privilege(
              'anon',
              'atlas.activate_content_release(text,text,text,text)',
              'EXECUTE'
            ) or has_function_privilege(
              'authenticated',
              'atlas.publish_content_release(text,text,integer,integer,integer,integer,integer)',
              'EXECUTE'
            ) or has_function_privilege(
              'authenticated',
              'atlas.activate_content_release(text,text,text,text)',
              'EXECUTE'
            ) or has_table_privilege('anon', 'atlas.content_entries', 'SELECT')
              or not has_table_privilege('anon', 'atlas.public_content_entries', 'SELECT') then
              raise exception 'anonymous content privileges are broader or narrower than intended';
            end if;
            if has_function_privilege(
              'anon',
              'atlas.guard_content_release_record()',
              'EXECUTE'
            ) or has_function_privilege(
              'authenticated',
              'atlas.guard_content_release_record()',
              'EXECUTE'
            ) or has_function_privilege(
              'service_role',
              'atlas.guard_content_release_record()',
              'EXECUTE'
            ) or has_function_privilege(
              'anon',
              'atlas.guard_content_release_scoped_record()',
              'EXECUTE'
            ) or has_function_privilege(
              'authenticated',
              'atlas.guard_content_release_scoped_record()',
              'EXECUTE'
            ) or has_function_privilege(
              'service_role',
              'atlas.guard_content_release_scoped_record()',
              'EXECUTE'
            ) then
              raise exception 'public application roles can execute a content trigger guard';
            end if;
          end;
          $$;
          SQL
      - name: Import and verify the deterministic release twice
        shell: bash
        run: |
          version_key="$(node -p "require('./public/map-assets/manifest.json').versionKey")"
          PGOPTIONS='-c role=service_role' node scripts/production/database-release.mjs --apply --confirm-version "$version_key"
          PGOPTIONS='-c role=service_role' node scripts/production/database-release.mjs --apply --confirm-version "$version_key"
          PGOPTIONS='-c role=service_role' psql --set ON_ERROR_STOP=1 --command "select * from atlas.activate_release('stable', '$version_key', null, 'CI activation');"
          psql --set ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            active_maps integer;
            active_pois integer;
            active_page_states integer;
          begin
            select count(*) into active_maps
            from atlas.maps as maps
            join atlas.channels as channels on channels.active_release_id = maps.release_id
            where channels.code = 'stable';
            select count(*) into active_pois
            from atlas.pois as pois
            join atlas.channels as channels on channels.active_release_id = pois.release_id
            where channels.code = 'stable';
            select count(*) into active_page_states
            from atlas.page_states as page_states
            join atlas.channels as channels on channels.active_release_id = page_states.release_id
            where channels.code = 'stable';
            if active_maps <> 10 or active_pois <> 3792 or active_page_states <> 18 then
              raise exception 'Unexpected active release counts: maps %, pois %, page_states %',
                active_maps, active_pois, active_page_states;
            end if;
          end;
          $$;
          SQL
          anon_maps="$(PGOPTIONS='-c role=anon' psql --set ON_ERROR_STOP=1 --no-align --tuples-only --command 'select count(*) from atlas.maps;')"
          anon_page_states="$(PGOPTIONS='-c role=anon' psql --set ON_ERROR_STOP=1 --no-align --tuples-only --command 'select count(*) from atlas.page_states;')"
          test "$anon_maps" = "10"
          test "$anon_page_states" = "18"
      - name: Import and verify the deterministic editorial release twice
        shell: bash
        run: |
          PGOPTIONS='-c role=service_role' node scripts/content/release.mjs \
            --as-of "$CONTENT_RELEASE_AS_OF" \
            --json-output /tmp/atlas-content-release.json \
            >/tmp/atlas-content-release-summary.json
          content_version="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/atlas-content-release.json','utf8')).versionKey")"
          content_entries="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/atlas-content-release.json','utf8')).counts.entries")"
          content_translations="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/atlas-content-release.json','utf8')).counts.translations")"
          content_target="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/atlas-content-release-summary.json','utf8')).targetFingerprint")"
          PGOPTIONS='-c role=service_role' node scripts/content/release.mjs \
            --as-of "$CONTENT_RELEASE_AS_OF" \
            --apply \
            --snapshot-input /tmp/atlas-content-release.json \
            --confirm-version "$content_version" \
            --confirm-target "$content_target"
          psql --set ON_ERROR_STOP=1 <<SQL
          alter table atlas.content_entries disable trigger atlas_content_release_scoped_immutability;
          update atlas.content_entries
          set reading_minutes = reading_minutes + 1
          where (release_id, id) = (
            select release_id, id
            from atlas.content_entries
            where release_id = (select id from atlas.content_releases where version_key = '$content_version')
            order by content_key
            limit 1
          );
          alter table atlas.content_entries enable trigger atlas_content_release_scoped_immutability;
          SQL
          if PGOPTIONS='-c role=service_role' node scripts/content/release.mjs \
            --as-of "$CONTENT_RELEASE_AS_OF" \
            --apply \
            --snapshot-input /tmp/atlas-content-release.json \
            --confirm-version "$content_version" \
            --confirm-target "$content_target"; then
            echo 'Content importer accepted a same-version row drift' >&2
            exit 1
          fi
          psql --set ON_ERROR_STOP=1 <<SQL
          alter table atlas.content_entries disable trigger atlas_content_release_scoped_immutability;
          update atlas.content_entries
          set reading_minutes = reading_minutes - 1
          where (release_id, id) = (
            select release_id, id
            from atlas.content_entries
            where release_id = (select id from atlas.content_releases where version_key = '$content_version')
            order by content_key
            limit 1
          );
          alter table atlas.content_entries enable trigger atlas_content_release_scoped_immutability;
          SQL
          PGOPTIONS='-c role=service_role' node scripts/content/release.mjs \
            --as-of "$CONTENT_RELEASE_AS_OF" \
            --apply \
            --snapshot-input /tmp/atlas-content-release.json \
            --confirm-version "$content_version" \
            --confirm-target "$content_target"
          PGOPTIONS='-c role=service_role' psql --set ON_ERROR_STOP=1 \
            --command "select * from atlas.activate_content_release('stable', null, '$content_version', 'CI activation');"
          if PGOPTIONS='-c role=service_role' psql --set ON_ERROR_STOP=1 \
            --command "select * from atlas.activate_content_release('stable', null, '$content_version', 'stale CI activation');"; then
            echo 'A stale content-channel CAS unexpectedly succeeded' >&2
            exit 1
          fi
          stable_content_version="$(psql --set ON_ERROR_STOP=1 --no-align --tuples-only \
            --command "select releases.version_key from atlas.content_channels as channels join atlas.content_releases as releases on releases.id = channels.active_release_id where channels.code = 'stable';")"
          test "$stable_content_version" = "$content_version"
          if PGOPTIONS='-c role=service_role' psql --set ON_ERROR_STOP=1 \
            --command "insert into atlas.content_release_events (channel_code, to_release_id, reason) select 'stable', id, 'direct write must fail' from atlas.content_releases where version_key = '$content_version';"; then
            echo 'service_role wrote directly to the content audit log' >&2
            exit 1
          fi
          PGOPTIONS='-c role=service_role -c request.jwt.claim.sub=spoofed-jwt-subject' \
            psql --set ON_ERROR_STOP=1 \
            --command "select * from atlas.activate_content_release('preview', null, '$content_version', 'CI audit principal check');"
          content_audit_principal="$(psql --set ON_ERROR_STOP=1 --no-align --tuples-only \
            --command "select actor || '|' || actor_claim from atlas.content_release_events where channel_code = 'preview' order by id desc limit 1;")"
          test "$content_audit_principal" = 'postgres|spoofed-jwt-subject'
          anon_content_entries="$(PGOPTIONS='-c role=anon' psql --set ON_ERROR_STOP=1 --no-align --tuples-only --command 'select count(distinct content_key) from atlas.public_content_entries;')"
          anon_content_translations="$(PGOPTIONS='-c role=anon' psql --set ON_ERROR_STOP=1 --no-align --tuples-only --command 'select count(*) from atlas.public_content_entries;')"
          test "$anon_content_entries" = "$content_entries"
          test "$anon_content_translations" = "$content_translations"
          test "$content_translations" = "$((content_entries * 3))"
      - name: Prove published editorial children are immutable
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            published_release_id uuid;
            published_entry_id uuid;
          begin
            select channels.active_release_id
              into published_release_id
            from atlas.content_channels as channels
            where channels.code = 'stable';
            select entries.id
              into published_entry_id
            from atlas.content_entries as entries
            where entries.release_id = published_release_id
            order by entries.content_key
            limit 1;
            if published_release_id is null or published_entry_id is null then
              raise exception 'Published editorial release is unavailable for immutability checks';
            end if;

            begin
              insert into atlas.content_entries (release_id, id)
              values (published_release_id, gen_random_uuid());
              raise exception 'Published content child INSERT was not rejected';
            exception when sqlstate '55000' then
              null;
            end;
            begin
              update atlas.content_entries
              set reading_minutes = reading_minutes
              where release_id = published_release_id and id = published_entry_id;
              raise exception 'Published content child UPDATE was not rejected';
            exception when sqlstate '55000' then
              null;
            end;
            begin
              delete from atlas.content_entries
              where release_id = published_release_id and id = published_entry_id;
              raise exception 'Published content child DELETE was not rejected';
            exception when sqlstate '55000' then
              null;
            end;
          end;
          $$;
          SQL
      - name: Prove published release children are immutable
        run: |
          PGOPTIONS='-c role=service_role' psql --set ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            active_release_id uuid;
            draft_release_id uuid;
            published_revision_id bigint;
            draft_revision_id bigint;
            guarded_table_count integer;
            guarded_table text;
          begin
            select channels.active_release_id
              into active_release_id
            from atlas.channels as channels
            where channels.code = 'stable';
            if active_release_id is null then
              raise exception 'Stable release is not active for immutability checks';
            end if;

            select count(distinct tables.relname)
              into guarded_table_count
            from pg_catalog.pg_trigger as triggers
            join pg_catalog.pg_class as tables on tables.oid = triggers.tgrelid
            join pg_catalog.pg_namespace as schemas on schemas.oid = tables.relnamespace
            join pg_catalog.pg_proc as functions on functions.oid = triggers.tgfoid
            where schemas.nspname = 'atlas'
              and tables.relname = any (array[
                'maps', 'pois', 'localizations', 'aliases', 'revisions', 'page_states'
              ])
              and functions.proname = 'guard_release_scoped_record'
              and not triggers.tgisinternal
              and triggers.tgenabled <> 'D';
            if guarded_table_count <> 6 then
              raise exception 'Expected six enabled release-child guards, found %', guarded_table_count;
            end if;

            foreach guarded_table in array array[
              'maps', 'pois', 'localizations', 'aliases', 'revisions', 'page_states'
            ] loop
              if pg_catalog.has_table_privilege(
                'service_role',
                format('atlas.%I', guarded_table),
                'TRUNCATE'
              ) then
                raise exception 'service_role must not be able to TRUNCATE atlas.%', guarded_table;
              end if;

              begin
                execute format(
                  'update atlas.%I set release_id = release_id where release_id = $1',
                  guarded_table
                ) using active_release_id;
                raise exception 'Published child guard did not reject UPDATE on atlas.%', guarded_table;
              exception when sqlstate '55000' then
                null;
              end;
            end loop;

            select revisions.id
              into published_revision_id
            from atlas.revisions as revisions
            where revisions.release_id = active_release_id
            order by revisions.id
            limit 1;
            if published_revision_id is null then
              raise exception 'Published release has no revision row for immutability checks';
            end if;

            insert into atlas.releases (
              version_key, source_build, status_code, manifest, stats
            ) values (
              'sha256-cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc',
              'ci-release-child-guard',
              'validating',
              '{}'::jsonb,
              '{}'::jsonb
            ) returning id into draft_release_id;

            insert into atlas.revisions (
              release_id, entity_kind, entity_key, revision_number,
              document, document_sha256, change_summary
            ) values (
              draft_release_id, 'release', 'ci-draft', 1,
              '{}'::jsonb, repeat('d', 64), 'draft insert is allowed'
            ) returning id into draft_revision_id;
            update atlas.revisions
              set change_summary = 'draft update is allowed'
              where id = draft_revision_id;

            begin
              insert into atlas.revisions (
                release_id, entity_kind, entity_key, revision_number,
                document, document_sha256, change_summary
              ) values (
                active_release_id, 'release', 'ci-published-insert', 999999,
                '{}'::jsonb, repeat('a', 64), 'must be rejected'
              );
              raise exception 'Published child INSERT was not rejected';
            exception when sqlstate '55000' then
              null;
            end;

            begin
              update atlas.revisions
                set change_summary = 'must be rejected'
                where id = published_revision_id;
              raise exception 'Published child UPDATE was not rejected';
            exception when sqlstate '55000' then
              null;
            end;

            begin
              delete from atlas.revisions where id = published_revision_id;
              raise exception 'Published child DELETE was not rejected';
            exception when sqlstate '55000' then
              null;
            end;

            begin
              update atlas.revisions
                set release_id = draft_release_id
                where id = published_revision_id;
              raise exception 'Published OLD.release_id was not rejected';
            exception when sqlstate '55000' then
              null;
            end;

            begin
              update atlas.revisions
                set release_id = active_release_id
                where id = draft_revision_id;
              raise exception 'Published NEW.release_id was not rejected';
            exception when sqlstate '55000' then
              null;
            end;

            delete from atlas.revisions where id = draft_revision_id;
            if exists (select 1 from atlas.revisions where id = draft_revision_id) then
              raise exception 'Draft child DELETE should remain allowed';
            end if;
          end;
          $$;
          SQL
